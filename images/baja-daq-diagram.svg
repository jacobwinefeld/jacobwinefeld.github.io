<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1062" width="800" height="1062" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e9ebee"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a909a" stroke-width="2"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4048"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="800" height="1062" fill="#ffffff"/>
  <text x="20" y="40" font-size="28" font-weight="700" fill="#1f2328">Sensor locations</text>
  <text x="20" y="68" font-size="20" fill="#5b626b">Front left corner, top view, not to scale</text>

  <g transform="translate(0,90)">
    <rect x="20" y="0" width="220" height="28" fill="url(#hatch)" stroke="#3b4048" stroke-width="2"/>
    <text x="255" y="22" font-size="22" fill="#1f2328">Barrier</text>

    <!-- chassis outline -->
    <rect x="520" y="20" width="260" height="290" fill="#f6f7f8" stroke="#3b4048" stroke-width="2"/>
    <text x="650" y="48" font-size="22" text-anchor="middle" fill="#1f2328">Chassis</text>

    <!-- hub axle -->
    <line x1="95" y1="125" x2="182" y2="175" stroke="#8a909a" stroke-width="12" stroke-linecap="round"/>
    <!-- tire, steered 30 degrees -->
    <g transform="rotate(30 95 125)">
      <rect x="60" y="40" width="70" height="170" rx="14" fill="#d7dbe0" stroke="#3b4048" stroke-width="3"/>
    </g>
    <text x="80" y="252" font-size="22" text-anchor="middle" fill="#1f2328">Tire</text>

    <!-- lower A-arm -->
    <line x1="182" y1="175" x2="520" y2="62" stroke="#3b4048" stroke-width="10" stroke-linecap="round"/>
    <line x1="182" y1="175" x2="520" y2="215" stroke="#3b4048" stroke-width="10" stroke-linecap="round"/>
    <text transform="translate(400,102) rotate(-18.5) translate(0,-16)" font-size="22" text-anchor="middle" fill="#1f2328">Lower A-arm</text>

    <!-- knuckle -->
    <g transform="rotate(30 182 175)">
      <rect x="174" y="120" width="16" height="110" rx="6" fill="#8a909a" stroke="#3b4048" stroke-width="2"/>
    </g>

    <!-- tie rod -->
    <line x1="209" y1="127" x2="560" y2="127" stroke="#ffffff" stroke-width="16"/>
    <line x1="209" y1="127" x2="560" y2="127" stroke="#5b626b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="209" cy="127" r="6" fill="#3b4048"/>
    <text x="270" y="108" font-size="22" text-anchor="middle" fill="#1f2328">Tie rod</text>

    <!-- rack -->
    <rect x="560" y="103" width="190" height="48" rx="8" fill="#ffffff" stroke="#3b4048" stroke-width="2"/>
    <text x="655" y="134" font-size="22" text-anchor="middle" fill="#1f2328">Steering rack</text>

    <!-- shock: chassis mount to aft tube, hub side -->
    <line x1="520" y1="270" x2="266" y2="185" stroke="#ffffff" stroke-width="20"/>
    <line x1="520" y1="270" x2="266" y2="185" stroke="#8a909a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="520" cy="270" r="6" fill="#3b4048"/>
    <circle cx="266" cy="185" r="6" fill="#3b4048"/>
    <text x="335" y="262" font-size="22" text-anchor="middle" fill="#1f2328">Shock</text>

    <!-- shock potentiometer alongside shock -->
    <line x1="477" y1="272" x2="299" y2="213" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="440" cy="292" r="15" fill="#c2410c"/>
    <text x="440" y="299" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

    <!-- gauge 1 tie rod -->
    <rect x="406" y="119" width="48" height="16" rx="3" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
    <circle cx="430" cy="160" r="15" fill="#c2410c"/>
    <text x="430" y="167" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>

    <!-- gauge 2 aft tube center -->
    <g transform="rotate(6.75 351 188)"><rect x="329" y="183.5" width="44" height="9" rx="3" fill="#c2410c" stroke="#ffffff" stroke-width="2"/></g>
    <g transform="rotate(6.75 351 202)"><rect x="329" y="197.5" width="44" height="9" rx="3" fill="#c2410c" stroke="#ffffff" stroke-width="2"/></g>
    <circle cx="351" cy="152" r="15" fill="#c2410c"/>
    <text x="351" y="159" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>

    <!-- IMU at chassis CG, centered -->
    <rect x="600" y="198" width="100" height="44" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="3"/>
    <text x="650" y="227" font-size="22" text-anchor="middle" fill="#1f2328">IMU</text>
    <line x1="650" y1="242" x2="650" y2="258" stroke="#c2410c" stroke-width="3" marker-end="url(#arrO)"/>
    <circle cx="650" cy="276" r="14" fill="#ffffff" stroke="#3b4048" stroke-width="2"/>
    <path d="M650,276 L650,262 A14,14 0 0 1 664,276 Z M650,276 L650,290 A14,14 0 0 1 636,276 Z" fill="#3b4048"/>
    <text x="672" y="283" font-size="20" fill="#5b626b">CG</text>

    <!-- key -->
    <circle cx="35" cy="335" r="15" fill="#c2410c"/>
    <text x="35" y="342" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="62" y="342" font-size="22" fill="#1f2328">Tie rod: axial load (quarter bridge)</text>
    <circle cx="35" cy="377" r="15" fill="#c2410c"/>
    <text x="35" y="384" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="62" y="384" font-size="22" fill="#1f2328">Lower A-arm, aft tube: bending (half bridge)</text>
    <circle cx="35" cy="419" r="15" fill="#c2410c"/>
    <text x="35" y="426" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="62" y="426" font-size="22" fill="#1f2328">Shock potentiometer: shock travel</text>
  </g>

  
  <g transform="translate(0,30)">
    <text x="20" y="537" font-size="28" font-weight="700" fill="#1f2328">Data acquisition</text>

  <g transform="translate(30,557)" font-size="22" fill="#1f2328">
    <rect x="0" y="0" width="230" height="70" rx="10" fill="#fdf0e8" stroke="#c2410c" stroke-width="3"/>
    <text x="115" y="42" text-anchor="middle">Strain gauges</text>
    <rect x="255" y="0" width="230" height="70" rx="10" fill="#fdf0e8" stroke="#c2410c" stroke-width="3"/>
    <text x="370" y="42" text-anchor="middle">Shock potentiometer</text>
    <rect x="510" y="0" width="230" height="70" rx="10" fill="#fdf0e8" stroke="#c2410c" stroke-width="3"/>
    <text x="625" y="42" text-anchor="middle">IMU</text>

    <line x1="115" y1="70" x2="115" y2="96" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="0" y="100" width="230" height="60" rx="10" fill="#f1f3f5" stroke="#3b4048" stroke-width="2"/>
    <text x="115" y="137" text-anchor="middle">Amplifier</text>

    <line x1="115" y1="160" x2="115" y2="186" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="370" y1="70" x2="370" y2="186" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="0" y="190" width="485" height="60" rx="10" fill="#f1f3f5" stroke="#3b4048" stroke-width="2"/>
    <text x="242" y="227" text-anchor="middle">Analog-to-digital converter</text>

    <line x1="242" y1="250" x2="242" y2="276" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="625" y1="70" x2="625" y2="276" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="0" y="280" width="740" height="60" rx="10" fill="#f1f3f5" stroke="#3b4048" stroke-width="2"/>
    <text x="370" y="317" text-anchor="middle">ESP32 microcontroller</text>

    <line x1="110" y1="340" x2="110" y2="366" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="370" y1="340" x2="370" y2="366" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="630" y1="340" x2="630" y2="366" stroke="#3b4048" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="0" y="370" width="220" height="86" rx="10" fill="#ffffff" stroke="#3b4048" stroke-width="2"/>
    <text x="110" y="408" text-anchor="middle">Component loads</text><text x="110" y="436" text-anchor="middle">for FEA</text>
    <rect x="260" y="370" width="220" height="86" rx="10" fill="#ffffff" stroke="#3b4048" stroke-width="2"/>
    <text x="370" y="408" text-anchor="middle">Kinematic</text><text x="370" y="436" text-anchor="middle">load model</text>
    <rect x="520" y="370" width="220" height="86" rx="10" fill="#ffffff" stroke="#3b4048" stroke-width="2"/>
    <text x="630" y="408" text-anchor="middle">Shock and vehicle</text><text x="630" y="436" text-anchor="middle">dynamics tuning</text>
  </g>
</g>
</svg>
